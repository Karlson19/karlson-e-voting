{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<h1 class="h3">Profile</h1>
<div class="card mt-3">
  <div class="card-body">
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Staff:</strong> {{ user.is_staff }}</p>
  </div>
</div>
{% endblock %}
